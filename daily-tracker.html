<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Daily Tracker</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;600&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />
<script src="https://cdn.tailwindcss.com"></script>
<style>
  :root {
    --gold: #C9A84C;
    --gold-light: #E2C97E;
    --gold-dim: #7a6530;
    --emerald: #2ECC8A;
    --emerald-dim: #1a7a52;
    --bg: #0D0D0D;
    --card: #161616;
    --card2: #1e1e1e;
    --border: #2a2a2a;
    --text: #e8e3d8;
    --muted: #6b6560;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background-color: var(--bg);
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    min-height: 100vh;
    background-image:
      radial-gradient(ellipse 60% 40% at 50% 0%, rgba(201,168,76,0.06) 0%, transparent 70%),
      radial-gradient(ellipse 40% 30% at 80% 80%, rgba(46,204,138,0.04) 0%, transparent 60%);
  }

  h1, h2, .display { font-family: 'Cormorant Garamond', serif; }

  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 20px;
    margin-bottom: 12px;
  }

  .section-title {
    font-family: 'Cormorant Garamond', serif;
    font-size: 1.15rem;
    font-weight: 600;
    letter-spacing: 0.04em;
    color: var(--gold-light);
    margin-bottom: 14px;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .section-title .icon {
    font-size: 1rem;
    opacity: 0.85;
  }

  /* Custom Checkbox */
  .check-item {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 0;
    border-bottom: 1px solid var(--border);
    cursor: pointer;
    transition: opacity 0.2s;
  }
  .check-item:last-child { border-bottom: none; }
  .check-item:hover { opacity: 0.85; }

  .check-box {
    width: 22px; height: 22px;
    border: 1.5px solid var(--gold-dim);
    border-radius: 6px;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
    transition: all 0.2s ease;
    background: transparent;
    cursor: pointer;
  }
  .check-box.checked {
    background: var(--gold);
    border-color: var(--gold);
  }
  .check-box.emerald-check { border-color: var(--emerald-dim); }
  .check-box.emerald-check.checked { background: var(--emerald); border-color: var(--emerald); }

  .check-box svg { display: none; }
  .check-box.checked svg { display: block; }

  .check-label {
    font-size: 0.92rem;
    font-weight: 400;
    color: var(--text);
    flex: 1;
    transition: color 0.2s;
  }
  .check-item.done .check-label {
    color: var(--muted);
    text-decoration: line-through;
  }

  /* Prayer Counter */
  .prayer-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 0;
    border-bottom: 1px solid var(--border);
  }
  .prayer-row:last-child { border-bottom: none; }

  .prayer-name { font-size: 0.9rem; color: var(--text); min-width: 70px; }

  .progress-wrap {
    flex: 1;
    margin: 0 12px;
    height: 4px;
    background: var(--border);
    border-radius: 99px;
    overflow: hidden;
  }
  .progress-bar {
    height: 100%;
    background: linear-gradient(90deg, var(--gold-dim), var(--gold));
    border-radius: 99px;
    transition: width 0.4s ease;
  }

  .counter-wrap {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .count-val {
    font-family: 'Cormorant Garamond', serif;
    font-size: 1rem;
    font-weight: 600;
    color: var(--gold-light);
    min-width: 36px;
    text-align: right;
  }
  .inc-btn {
    width: 28px; height: 28px;
    border-radius: 50%;
    border: 1.5px solid var(--gold-dim);
    background: transparent;
    color: var(--gold);
    font-size: 1.1rem;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    transition: all 0.15s;
    line-height: 1;
  }
  .inc-btn:hover { background: var(--gold); color: #000; border-color: var(--gold); }
  .inc-btn:active { transform: scale(0.92); }

  /* Input */
  .input-row {
    display: flex;
    gap: 8px;
    margin-top: 14px;
  }
  input[type="text"], input[type="url"] {
    flex: 1;
    background: var(--card2);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px 14px;
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    font-size: 0.85rem;
    outline: none;
    transition: border-color 0.2s;
  }
  input:focus { border-color: var(--gold-dim); }
  input::placeholder { color: var(--muted); }

  .add-btn {
    background: var(--gold);
    color: #000;
    border: none;
    border-radius: 10px;
    padding: 10px 16px;
    font-family: 'DM Sans', sans-serif;
    font-size: 0.85rem;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.15s;
    white-space: nowrap;
  }
  .add-btn:hover { background: var(--gold-light); }
  .add-btn:active { transform: scale(0.97); }

  .todo-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 0;
    border-bottom: 1px solid var(--border);
    animation: fadeIn 0.3s ease;
  }
  .todo-item:last-child { border-bottom: none; }

  .del-btn {
    background: none;
    border: none;
    color: var(--muted);
    cursor: pointer;
    padding: 2px 4px;
    font-size: 1rem;
    transition: color 0.15s;
    flex-shrink: 0;
  }
  .del-btn:hover { color: #e74c3c; }

  .link-icon {
    color: var(--emerald);
    font-size: 0.8rem;
    flex-shrink: 0;
  }

  /* Reset Button */
  .reset-btn {
    width: 100%;
    padding: 14px;
    background: transparent;
    border: 1px solid #3a2020;
    border-radius: 12px;
    color: #c0392b;
    font-family: 'DM Sans', sans-serif;
    font-size: 0.9rem;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.2s;
    letter-spacing: 0.04em;
    margin-top: 4px;
  }
  .reset-btn:hover { background: rgba(192,57,43,0.1); border-color: #c0392b; }

  /* Header */
  .header {
    text-align: center;
    padding: 32px 0 20px;
  }
  .header h1 {
    font-size: 2.1rem;
    font-weight: 300;
    letter-spacing: 0.08em;
    color: var(--gold-light);
    line-height: 1.1;
  }
  .header .date {
    font-size: 0.78rem;
    color: var(--muted);
    letter-spacing: 0.12em;
    text-transform: uppercase;
    margin-top: 6px;
  }

  .divider {
    width: 40px;
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--gold-dim), transparent);
    margin: 8px auto;
  }

  /* Badge */
  .goal-badge {
    font-size: 0.7rem;
    color: var(--muted);
    margin-left: auto;
    letter-spacing: 0.05em;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(-4px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .completion-ring {
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Cormorant Garamond', serif;
    font-size: 0.8rem;
    color: var(--gold-dim);
    gap: 4px;
    margin-top: 14px;
    border-top: 1px solid var(--border);
    padding-top: 12px;
  }
  .completion-ring span { color: var(--gold-light); font-size: 1rem; font-weight: 600; }

  /* Scrollbar */
  ::-webkit-scrollbar { width: 4px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 99px; }
</style>
</head>
<body>

<div style="max-width: 480px; margin: 0 auto; padding: 0 16px 40px;">

  <!-- Header -->
  <div class="header">
    <h1>Daily Tracker</h1>
    <div class="divider"></div>
    <div class="date" id="dateDisplay"></div>
  </div>

  <!-- 1. Daily Namaz -->
  <div class="card">
    <div class="section-title"><span class="icon">🕌</span> Daily Namaz</div>
    <div id="namazList">
      <div class="check-item" data-key="namaz_fajr">
        <div class="check-box" id="cb_namaz_fajr">
          <svg width="13" height="10" viewBox="0 0 13 10" fill="none"><path d="M1 5L5 9L12 1" stroke="#000" stroke-width="2" stroke-linecap="round"/></svg>
        </div>
        <span class="check-label">Fajr</span>
      </div>
      <div class="check-item" data-key="namaz_dhuhr">
        <div class="check-box" id="cb_namaz_dhuhr">
          <svg width="13" height="10" viewBox="0 0 13 10" fill="none"><path d="M1 5L5 9L12 1" stroke="#000" stroke-width="2" stroke-linecap="round"/></svg>
        </div>
        <span class="check-label">Dhuhr</span>
      </div>
      <div class="check-item" data-key="namaz_asr">
        <div class="check-box" id="cb_namaz_asr">
          <svg width="13" height="10" viewBox="0 0 13 10" fill="none"><path d="M1 5L5 9L12 1" stroke="#000" stroke-width="2" stroke-linecap="round"/></svg>
        </div>
        <span class="check-label">Asr</span>
      </div>
      <div class="check-item" data-key="namaz_maghrib">
        <div class="check-box" id="cb_namaz_maghrib">
          <svg width="13" height="10" viewBox="0 0 13 10" fill="none"><path d="M1 5L5 9L12 1" stroke="#000" stroke-width="2" stroke-linecap="round"/></svg>
        </div>
        <span class="check-label">Maghrib</span>
      </div>
      <div class="check-item" data-key="namaz_isha">
        <div class="check-box" id="cb_namaz_isha">
          <svg width="13" height="10" viewBox="0 0 13 10" fill="none"><path d="M1 5L5 9L12 1" stroke="#000" stroke-width="2" stroke-linecap="round"/></svg>
        </div>
        <span class="check-label">Isha</span>
      </div>
    </div>
    <div class="completion-ring">
      <span id="namazCount">0</span> / 5 prayers completed
    </div>
  </div>

  <!-- 2. Swalath Tracker -->
  <div class="card">
    <div class="section-title"><span class="icon">📿</span> Swalath Tracker <span class="goal-badge">Goal: 250 each</span></div>
    <div id="swalathList">
      <!-- rendered by JS -->
    </div>
  </div>

  <!-- 3. Quran Recitation -->
  <div class="card">
    <div class="section-title"><span class="icon">📖</span> Quran Recitation</div>
    <div class="check-item" data-key="quran_yaseen">
      <div class="check-box emerald-check" id="cb_quran_yaseen">
        <svg width="13" height="10" viewBox="0 0 13 10" fill="none"><path d="M1 5L5 9L12 1" stroke="#000" stroke-width="2" stroke-linecap="round"/></svg>
      </div>
      <span class="check-label">Surah Yaseen</span>
    </div>
    <div class="check-item" data-key="quran_mulk">
      <div class="check-box emerald-check" id="cb_quran_mulk">
        <svg width="13" height="10" viewBox="0 0 13 10" fill="none"><path d="M1 5L5 9L12 1" stroke="#000" stroke-width="2" stroke-linecap="round"/></svg>
      </div>
      <span class="check-label">Surah Al-Mulk</span>
    </div>
    <div class="check-item" data-key="quran_waqiah">
      <div class="check-box emerald-check" id="cb_quran_waqiah">
        <svg width="13" height="10" viewBox="0 0 13 10" fill="none"><path d="M1 5L5 9L12 1" stroke="#000" stroke-width="2" stroke-linecap="round"/></svg>
      </div>
      <span class="check-label">Surah Al-Waqiah</span>
    </div>
  </div>

  <!-- 4. Learning & Growth -->
  <div class="card">
    <div class="section-title"><span class="icon">🌱</span> Learning & Growth</div>

    <!-- Fluency -->
    <div style="margin-bottom:16px;">
      <div style="font-size:0.75rem; color:var(--muted); letter-spacing:0.1em; text-transform:uppercase; margin-bottom:8px;">Fluency Track</div>
      <div class="check-item" data-key="fluency_practice">
        <div class="check-box emerald-check" id="cb_fluency_practice">
          <svg width="13" height="10" viewBox="0 0 13 10" fill="none"><path d="M1 5L5 9L12 1" stroke="#000" stroke-width="2" stroke-linecap="round"/></svg>
        </div>
        <span class="check-label">Daily Practice</span>
      </div>
    </div>

    <!-- Entrepreneurship -->
    <div>
      <div style="font-size:0.75rem; color:var(--muted); letter-spacing:0.1em; text-transform:uppercase; margin-bottom:8px;">Entrepreneurship Tracker</div>
      <div id="entrepreneurList"></div>
      <div class="input-row">
        <input type="text" id="entInput" placeholder="Video URL or topic name…" />
        <button class="add-btn" onclick="addEntrepreneur()">Add</button>
      </div>
    </div>
  </div>

  <!-- 5. To-Do List -->
  <div class="card">
    <div class="section-title"><span class="icon">✅</span> To-Do List</div>
    <div id="todoList"></div>
    <div class="input-row">
      <input type="text" id="todoInput" placeholder="Add a task…" onkeydown="if(event.key==='Enter')addTodo()" />
      <button class="add-btn" onclick="addTodo()">Add</button>
    </div>
  </div>

  <!-- 6. Fitness -->
  <div class="card">
    <div class="section-title"><span class="icon">💪</span> Fitness</div>
    <div class="check-item" data-key="fitness_gym">
      <div class="check-box" id="cb_fitness_gym">
        <svg width="13" height="10" viewBox="0 0 13 10" fill="none"><path d="M1 5L5 9L12 1" stroke="#000" stroke-width="2" stroke-linecap="round"/></svg>
      </div>
      <span class="check-label">Gym</span>
    </div>
  </div>

  <!-- Reset -->
  <button class="reset-btn" onclick="confirmReset()">⟳ Reset Day</button>

</div>

<script>
// ─── State ────────────────────────────────────────────────
const SWALATH_NAMES = ['Fajr','Dhuhr','Asr','Maghrib','Isha'];
const SWALATH_GOAL = 250;

function loadState() {
  try { return JSON.parse(localStorage.getItem('dailyTracker') || '{}'); } catch { return {}; }
}
function saveState(s) { localStorage.setItem('dailyTracker', JSON.stringify(s)); }

let state = loadState();

// Defaults
if (!state.checks) state.checks = {};
if (!state.swalath) state.swalath = { Fajr:0, Dhuhr:0, Asr:0, Maghrib:0, Isha:0 };
if (!state.entrepreneur) state.entrepreneur = [];
if (!state.todos) state.todos = [];

// ─── Date Display ─────────────────────────────────────────
const dateEl = document.getElementById('dateDisplay');
const now = new Date();
dateEl.textContent = now.toLocaleDateString('en-US', { weekday:'long', year:'numeric', month:'long', day:'numeric' });

// ─── Checkboxes ───────────────────────────────────────────
function isUrl(str) {
  try { new URL(str); return str.startsWith('http'); } catch { return false; }
}

function initCheckboxes() {
  document.querySelectorAll('.check-item[data-key]').forEach(row => {
    const key = row.dataset.key;
    const box = row.querySelector('.check-box');
    if (state.checks[key]) { box.classList.add('checked'); row.classList.add('done'); }
    row.addEventListener('click', () => toggleCheck(key, box, row));
  });
  updateNamazCount();
}

function toggleCheck(key, box, row) {
  state.checks[key] = !state.checks[key];
  box.classList.toggle('checked', state.checks[key]);
  row.classList.toggle('done', state.checks[key]);
  saveState(state);
  if (key.startsWith('namaz_')) updateNamazCount();
}

function updateNamazCount() {
  const keys = ['namaz_fajr','namaz_dhuhr','namaz_asr','namaz_maghrib','namaz_isha'];
  const done = keys.filter(k => state.checks[k]).length;
  document.getElementById('namazCount').textContent = done;
}

// ─── Swalath ──────────────────────────────────────────────
function renderSwalath() {
  const list = document.getElementById('swalathList');
  list.innerHTML = '';
  SWALATH_NAMES.forEach(name => {
    const val = state.swalath[name] || 0;
    const pct = Math.min(100, (val / SWALATH_GOAL) * 100);
    const row = document.createElement('div');
    row.className = 'prayer-row';
    row.innerHTML = `
      <div class="prayer-name">${name}</div>
      <div class="progress-wrap"><div class="progress-bar" style="width:${pct}%"></div></div>
      <div class="counter-wrap">
        <div class="count-val">${val}</div>
        <button class="inc-btn" onclick="incrementSwalath('${name}')">+</button>
      </div>`;
    list.appendChild(row);
  });
}

function incrementSwalath(name) {
  if ((state.swalath[name] || 0) < SWALATH_GOAL) {
    state.swalath[name] = (state.swalath[name] || 0) + 1;
    saveState(state);
    renderSwalath();
  }
}

// ─── Entrepreneur ─────────────────────────────────────────
function renderEntrepreneur() {
  const list = document.getElementById('entrepreneurList');
  list.innerHTML = '';
  state.entrepreneur.forEach((item, i) => {
    const div = document.createElement('div');
    div.className = 'todo-item' + (item.checked ? ' done' : '');
    const url = isUrl(item.text);
    div.innerHTML = `
      <div class="check-box emerald-check${item.checked ? ' checked' : ''}" onclick="toggleEnt(${i})">
        <svg width="13" height="10" viewBox="0 0 13 10" fill="none"><path d="M1 5L5 9L12 1" stroke="#000" stroke-width="2" stroke-linecap="round"/></svg>
      </div>
      <span class="check-label" style="${item.checked?'text-decoration:line-through;color:var(--muted)':''}">
        ${url ? `<a href="${escHtml(item.text)}" target="_blank" style="color:var(--emerald);text-decoration:none;">${escHtml(item.text)}</a>` : escHtml(item.text)}
      </span>
      ${url ? `<span class="link-icon">🔗</span>` : ''}
      <button class="del-btn" onclick="deleteEnt(${i})">✕</button>`;
    list.appendChild(div);
  });
}

function addEntrepreneur() {
  const inp = document.getElementById('entInput');
  const val = inp.value.trim();
  if (!val) return;
  state.entrepreneur.push({ text: val, checked: false });
  saveState(state);
  renderEntrepreneur();
  inp.value = '';
}

function toggleEnt(i) {
  state.entrepreneur[i].checked = !state.entrepreneur[i].checked;
  saveState(state);
  renderEntrepreneur();
}

function deleteEnt(i) {
  state.entrepreneur.splice(i, 1);
  saveState(state);
  renderEntrepreneur();
}

// ─── To-Do ────────────────────────────────────────────────
function renderTodos() {
  const list = document.getElementById('todoList');
  list.innerHTML = '';
  state.todos.forEach((item, i) => {
    const div = document.createElement('div');
    div.className = 'todo-item' + (item.checked ? ' done' : '');
    div.innerHTML = `
      <div class="check-box${item.checked ? ' checked' : ''}" onclick="toggleTodo(${i})">
        <svg width="13" height="10" viewBox="0 0 13 10" fill="none"><path d="M1 5L5 9L12 1" stroke="#000" stroke-width="2" stroke-linecap="round"/></svg>
      </div>
      <span class="check-label" style="${item.checked?'text-decoration:line-through;color:var(--muted)':''}">
        ${escHtml(item.text)}
      </span>
      <button class="del-btn" onclick="deleteTodo(${i})">✕</button>`;
    list.appendChild(div);
  });
}

function addTodo() {
  const inp = document.getElementById('todoInput');
  const val = inp.value.trim();
  if (!val) return;
  state.todos.push({ text: val, checked: false });
  saveState(state);
  renderTodos();
  inp.value = '';
}

function toggleTodo(i) {
  state.todos[i].checked = !state.todos[i].checked;
  saveState(state);
  renderTodos();
}

function deleteTodo(i) {
  state.todos.splice(i, 1);
  saveState(state);
  renderTodos();
}

// ─── Reset ────────────────────────────────────────────────
function confirmReset() {
  if (!confirm('Reset all daily progress? Your entrepreneur links and to-do tasks will be kept.')) return;
  state.checks = {};
  state.swalath = { Fajr:0, Dhuhr:0, Asr:0, Maghrib:0, Isha:0 };
  // uncheck todos & entrepreneur but keep them
  state.todos.forEach(t => t.checked = false);
  state.entrepreneur.forEach(e => e.checked = false);
  saveState(state);
  location.reload();
}

// ─── Utility ──────────────────────────────────────────────
function escHtml(str) {
  return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ─── Init ─────────────────────────────────────────────────
initCheckboxes();
renderSwalath();
renderEntrepreneur();
renderTodos();
</script>
</body>
</html>
